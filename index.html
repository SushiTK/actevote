<style>
:root{
  --blue:#2546a6; --blue-ink:#1e3a8a; --blue-soft:#eef2fc; --blue-line:#e6eaf5; --on-blue:#dfe6fb;
  --ink:#161b2e; --muted:#4b5470;
  --pour:#1f7a4d; --contre:#c0392b;
  --yes:#1f7a4d; --yes-soft:#e3f3ea; --no:#b03328; --no-soft:#fbe7e5; --mid:#8a6411; --mid-soft:#f8efd9;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--blue);color:#fff;font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.screen{position:relative;max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
.blob{position:absolute;pointer-events:none;background:rgba(255,255,255,.07)}
.b1{width:320px;height:320px;border-radius:50%;top:-110px;right:-120px}
.b2{width:180px;height:180px;border-radius:50%;top:200px;left:-70px;background:rgba(255,255,255,.06)}
.b3{width:120px;height:120px;border-radius:40px;top:120px;right:40px;transform:rotate(18deg);background:rgba(255,255,255,.08)}
.top{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:22px 22px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.01em}
.logo{width:36px;height:36px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center}
.chip-btn{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:99px;padding:9px 15px;font-weight:600;font-size:14px;cursor:pointer}
.icon-btn{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.14);border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.hero{position:relative;padding:44px 24px 28px}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.12;font-weight:800}
h1{font-size:34px}
.lead{color:var(--on-blue);font-size:16px;margin-top:14px}
.steps{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.steps li{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;line-height:1.45;color:var(--on-blue)}
.steps li b{color:#fff}
.steps span{flex:none;width:28px;height:28px;border-radius:10px;background:rgba(255,255,255,.16);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
.why blockquote{margin:8px 0 0;font-weight:500;font-style:italic;color:var(--on-blue)}
.why cite{display:block;font-style:normal;font-size:12px;margin-top:2px;opacity:.85}
.why{margin:18px 0 0;font-size:14px;font-weight:600;color:#fff;background:rgba(255,255,255,.1);border-radius:14px;padding:10px 14px}
.sheet{position:relative;margin-top:auto;background:#fff;color:var(--ink);border-radius:32px 32px 0 0;padding:24px 20px 28px}
.sheet.grow{flex:1}
.frise{display:flex;gap:4px;margin-bottom:10px}.frise span{width:22px;height:4px;border-radius:2px;background:var(--blue)}.frise span:nth-child(2){background:#dfe4f2}.frise span:nth-child(3){background:#d62b2b}
.sheet h3{font-size:15px;font-weight:700;letter-spacing:0;margin-bottom:12px}
.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--blue-soft);border:0;border-radius:20px;padding:14px 16px;cursor:pointer;color:var(--ink)}
.mode+.mode{margin-top:10px}
.mode .num{width:46px;height:46px;border-radius:16px;background:#fff;color:var(--blue);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none}
.mode.main .num{background:var(--blue);color:#fff}
.mode b{display:block;font-size:16px}
.mode span.d{font-size:13px;color:var(--muted)}
.mode .grow{flex:1}
.fine{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}
.progress{flex:1;height:8px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden}
.progress>div{height:100%;background:#fff;border-radius:99px;transition:width .25s}
.count{font-weight:700;font-size:14px}
.tag{display:inline-block;background:rgba(255,255,255,.16);font-weight:700;font-size:13px;padding:6px 14px;border-radius:99px}
.q{font-size:28px;margin-top:14px}
.desc{font-size:13px;color:var(--muted);margin:0}
.eclair{background:var(--blue-soft);border-radius:18px;padding:14px 16px}
.eclair-t{display:inline-block;background:var(--blue);color:#fff;font-weight:700;font-size:12px;padding:3px 10px;border-radius:99px}
.eclair p{margin:8px 0 0;font-size:15px;line-height:1.5;color:var(--ink)}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);background:var(--blue-soft);border-radius:14px;padding:10px 14px;margin-top:14px}
.meta a{color:var(--blue);font-weight:700;text-decoration:none;white-space:nowrap}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.ans{border:0;border-radius:20px;padding:18px 0;font-weight:800;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .05s}
.ans:active{transform:scale(.98)}
.ans-pour{background:var(--pour);color:#fff}
.ans-contre{background:var(--contre);color:#fff}
.ans-skip{grid-column:1/-1;background:#fff;color:var(--ink);border:2px solid var(--blue-line);font-size:16px;padding:14px 0}
.sel{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink)}
details.ctx{margin-top:12px;font-size:13px;color:var(--muted)}
details.ctx summary{cursor:pointer;color:var(--blue);font-weight:700}
details.ctx p{margin:8px 0 0}
.note{background:var(--mid-soft);color:#5a430c;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
.best{position:relative;margin:20px 20px 0;background:rgba(255,255,255,.12);border-radius:24px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.best small{display:block;font-size:12px;font-weight:700;color:var(--on-blue);letter-spacing:.03em}
.best b{font-size:19px;line-height:1.2}
.best .pct{font-weight:800;font-size:38px;letter-spacing:-.02em}
.res{border-bottom:1px solid var(--blue-line)}
.res-btn{display:block;width:100%;background:none;border:0;text-align:left;padding:13px 0;cursor:pointer;color:var(--ink)}
.res-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.res-name{font-weight:700;font-size:15px}
.res-party{font-size:12.5px;color:var(--muted)}
.res-pct{font-weight:800;font-size:16px}
.bar{height:8px;background:var(--blue-line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:var(--blue);border-radius:99px}
.res-meta{font-size:12px;color:var(--muted);margin-top:6px}
.detail{padding:0 0 10px}
.drow{background:var(--blue-soft);border-radius:14px;padding:12px;font-size:14px}
.drow+.drow{margin-top:8px}
.dq{font-weight:600;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.c-agree{background:var(--yes-soft);color:var(--yes)}
.c-dis{background:var(--no-soft);color:var(--no)}
.c-mid{background:var(--mid-soft);color:var(--mid)}
.small{font-size:13px}
.muted{color:var(--muted)}
.lnk{color:var(--blue);font-weight:700;font-size:13px;text-decoration:none}
.split{color:var(--mid);font-weight:600}
.section-title{font-size:20px;margin:30px 0 4px}
.vcard{background:var(--blue-soft);border-radius:18px;padding:14px;margin-top:10px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin-top:8px}
.gcell{display:flex;flex-direction:column;align-items:center;border-radius:10px;padding:5px 2px;font-size:12px;font-weight:700;line-height:1.25}
.gcell i{font-style:normal;font-weight:500;font-size:11px}
.g-same{background:var(--yes-soft);color:var(--yes)}
.g-diff{background:var(--no-soft);color:var(--no)}
.g-a{background:var(--mid-soft);color:var(--mid)}
.g-none{background:#fff;color:#6b7280}
.notice{background:var(--blue-soft);border-radius:18px;padding:14px;font-size:13px;color:var(--muted);margin-top:22px}
.primary{display:block;width:100%;border:0;border-radius:20px;padding:16px;font-weight:800;font-size:16px;cursor:pointer;background:var(--blue);color:#fff;margin-top:16px}
.method p{margin:0 0 12px;font-size:14px;color:var(--ink)}
.method ul{margin:0 0 12px;padding-left:20px;font-size:14px}
.method li+li{margin-top:4px}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.tabs{display:flex;gap:6px;background:var(--blue-soft);border-radius:16px;padding:5px;margin:4px 0 18px;position:sticky;top:8px;z-index:2}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:14px;padding:10px 4px;border-radius:12px;cursor:pointer;font-family:inherit}
.tabs button.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(20,30,70,.12)}
.tq{background:var(--blue-soft);border-radius:16px;margin-top:10px;font-size:14px}
.tq summary{cursor:pointer;padding:12px 14px;list-style:none;color:var(--ink);font-weight:600}
.tq summary::-webkit-details-marker{display:none}
.tq .in{padding:0 14px 14px}
.tq .sub{font-weight:500;color:var(--muted);font-size:12.5px;display:block;margin-top:3px}
.gt{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}.gt td{padding:4px 2px;border-bottom:1px solid var(--blue-line)}.gt td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.th-t{font-size:13px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.04em;margin:22px 0 2px}
.warn{background:#fff7e0;color:#5a4400;border-radius:14px;padding:10px 14px;font-size:13px;margin-bottom:6px}
.share-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;background:transparent;border:2px solid var(--blue-line);color:var(--blue);font-weight:700;font-size:15px;padding:12px;border-radius:16px;cursor:pointer;font-family:inherit}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:9;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.qr-box{text-align:center;margin-top:26px;padding:20px 16px;background:var(--blue-soft);border-radius:20px}.qr{display:inline-block;background:#fff;padding:10px;border-radius:16px;line-height:0}
.soc{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}.soc-b{border:0;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:13.5px;padding:9px 14px;border-radius:99px;cursor:pointer;font-family:inherit}
</style>
</head>

te contre les fraudes sociales et fiscales ?", "desc": "Projet de loi relatif à la lutte contre les fraudes sociales et fiscales, vote sur le texte final.", "simple": "De nouveaux outils pour repérer et sanctionner la fraude aux aides sociales et la fraude fiscale, avec davantage d'échanges d'informations entre administrations.", "note": null, "date": "5 mai 2026", "result": "Adopté", "total": [335, 182, 5], "groups": {"RN": [109, 0, 0], "EPR": [79, 0, 0], "LFI": [0, 60, 0], "SOC": [0, 64, 1], "DR": [48, 0, 0], "ECOS": [0, 34, 0], "DEM": [34, 0, 0], "HOR": [33, 0, 0], "LIOT": [10, 7, 4], "GDR": [0, 16, 0], "UDR": [16, 0, 0]}, "titre": "l'ensemble du projet de loi relatif à la lutte contre les fraudes sociales et fiscales (texte de la commission mixte paritaire)."}, {"id": 7380, "theme": "Économie", "q": "Nationaliser ArcelorMittal France pour préserver la production d'acier en France ?", "desc": "Proposition de loi visant à la nationalisation d'ArcelorMittal France afin de préserver la souveraineté industrielle de la France (deuxième lecture).", "simple": "L'État prendrait le contrôle de la branche française du géant de l'acier ArcelorMittal, qui a annoncé des suppressions d'emplois, pour garantir la production d'acier sur le territoire.", "note": null, "date": "11 juin 2026", "result": "Adopté", "total": [106, 49, 47], "groups": {"RN": [0, 0, 45], "EPR": [0, 30, 0], "LFI": [45, 0, 0], "SOC": [25, 0, 0], "DR": [0, 2, 0], "ECOS": [20, 0, 0], "DEM": [0, 5, 0], "HOR": [0, 7, 2], "LIOT": [0, 1, 0], "UDR": [0, 4, 0], "GDR": [16, 0, 0]}, "titre": "l'ensemble de la proposition de loi visant à la nationalisation d'ArcelorMittal France afin de préserver la souveraineté industrielle de la France (deuxième lecture)."}, {"id": 8434, "theme": "Économie", "q": "Créer une « foncière de l'État » chargée de gérer et valoriser les bâtiments publics ?", "desc": "Proposition de loi visant à moderniser la gestion du patrimoine immobilier de l'État, vote sur le texte final.", "simple": " ure conventionnelle (une séparation à l'amiable) seraient indemnisées moins longtemps par l'assurance chômage. La mesure vient d'un accord négocié entre syndicats et patronat.", "note": null, "date": "2 juin 2026", "result": "Adopté", "total": [353, 114, 37], "groups": {"RN": [115, 0, 0], "EPR": [87, 0, 0], "LFI": [0, 63, 0], "SOC": [1, 18, 37], "DR": [44, 0, 0], "ECOS": [0, 14, 0], "DEM": [33, 0, 0], "HOR": [30, 0, 0], "LIOT": [19, 2, 0], "GDR": [0, 17, 0], "UDR": [14, 0, 0]}, "titre": "l'ensemble du projet de loi portant transposition de l'avenant n° 3 du 25 février 2026 au protocole d'accord du 10 novembre 2023 relatif à l'assurance chômage (deuxième lecture)."}, {"id": 289, "theme": "Logement", "q": "Donner aux mairies plus de moyens pour limiter les locations touristiques de type Airbnb ?", "desc": "Proposition de loi visant à renforcer les outils de régulation des meublés de tourisme à l'échelle locale, vote sur le texte final.", "simple": "Les communes peuvent limiter davantage les logements loués aux touristes, et l'avantage fiscal de ces locations est réduit, afin de remettre des logements à disposition des habitants.", "note": null, "date": "7 nov. 2024", "result": "Adopté", "total": [168, 54, 0], "groups": {"RN": [1, 51, 0], "EPR": [38, 0, 0], "LFI": [24, 0, 0], "SOC": [37, 0, 0], "DR": [18, 0, 0], "ECOS": [16, 0, 0], "DEM": [5, 0, 0], "HOR": [17, 0, 0], "LIOT": [5, 0, 0], "GDR": [5, 0, 0], "UDR": [0, 3, 0]}, "titre": "l'ensemble de la proposition de loi visant à renforcer les outils de régulation des meublés de tourisme à l'échelle locale (texte de la commission mixte paritaire)."}, {"id": 7408, "theme": "Logement", "q": "Réserver davantage de logements sociaux aux agents des services publics, en liant le logement à leur emploi ?", "desc": "Proposition de loi visant à améliorer l'accès au logement des travailleurs des services publics, vote sur le texte final.", "simple": "Davantage de logements sociaux pourront être réservés aux agents publics (justice, ur, vote sur le texte final.", "simple": "Oblige les universités à mettre en place des actions de prévention et des dispositifs de signalement, et renforce les sanctions disciplinaires contre les actes antisémites et racistes.", "note": "Certains députés ont voté contre en contestant non pas l'objectif, mais certaines dispositions qu'ils jugeaient menaçantes pour la liberté d'expression à l'université.", "date": "2 juil. 2025", "result": "Adopté", "total": [366, 88, 7], "groups": {"RN": [117, 0, 0], "EPR": [79, 0, 0], "LFI": [0, 65, 0], "SOC": [35, 0, 0], "DR": [40, 0, 0], "ECOS": [4, 11, 7], "DEM": [23, 0, 0], "HOR": [29, 0, 0], "LIOT": [17, 0, 0], "GDR": [3, 12, 0], "UDR": [14, 0, 0]}, "titre": "l'ensemble de la proposition de loi relative à la lutte contre l'antisémitisme dans l'enseignement supérieur (texte de la commission mixte paritaire)."}, {"id": 9203, "theme": "Éducation", "q": "Faire des accompagnants d'élèves en situation de handicap (AESH) des fonctionnaires de catégorie B ?", "desc": "Proposition de loi créant un corps de fonctionnaires pour les AESH, aujourd'hui majoritairement contractuels (première lecture).", "simple": "Les AESH accompagnent en classe les élèves en situation de handicap. Souvent à temps partiel et en contrat, ils deviendraient fonctionnaires, avec un statut plus stable.", "note": null, "date": "29 oct. 2026", "result": "Adopté", "total": [166, 16, 123], "groups": {"RN": [0, 1, 79], "EPR": [0, 6, 23], "LFI": [68, 0, 0], "SOC": [41, 0, 0], "DR": [7, 0, 3], "ECOS": [34, 0, 0], "DEM": [0, 7, 0], "HOR": [0, 2, 8], "LIOT": [4, 0, 0], "GDR": [12, 0, 0], "UDR": [0, 0, 10]}, "titre": "l'ensemble de la proposition de loi visant à créer un corps de fonctionnaires de catégorie B pour les accompagnants d’élèves en situation de handicap (première lecture)."}, {"id": 1041, "theme": "Sécurité & justice", "q": "Renforcer les pouvoirs des agents de sûreté dans les transports en commun ?", "desc": "Proposition de loi relative au renforcement de la sûreté dans les transports, vote sur le texte final.", "simple": "Donne davantage de moyens d'intervention aux agents de sécurité des transports en commun, comme ceux de la SNCF et de la RATP.", "note": null, "date": "18 mars 2025", "result": "Adopté", "total": [303, 135, 7], "groups": {"RN": [104, 0, 0], "EPR": [77, 0, 0], "LFI": [0, 53, 0], "SOC": [0, 42, 2], "DR": [34, 1, 1], "ECOS": [0, 27, 0], "DEM": [21, 0, 0], "HOR": [31, 0, 0], "LIOT": [17, 0, 4], "GDR": [0, 12, 0], "UDR": [14, 0, 0]}, "titre": "l'ensemble de la proposition de loi relative au renforcement de la sûreté dans les transports (texte de la commission mixte paritaire)."}, {"id": 1473, "theme": "Sécurité & justice", "q": "Durcir la lutte contre le narcotrafic ?", "desc": "Proposition de loi « visant à sortir la France du piège du narcotrafic », vote sur le texte final.", "simple": "Crée un parquet national spécialisé contre le crime organisé, renforce les moyens d'enquête et isole davantage les gros trafiquants en prison.", "note": null, "date": "29 avr. 2025", "result": "Adopté", "total": [396, 68, 34], "groups": {"RN": [109, 0, 0], "EPR": [73, 0, 0], "LFI": [0, 60, 0], "SOC": [63, 0, 1], "DR": [38, 0, 1], "ECOS": [0, 4, 25], "DEM": [36, 0, 0], "HOR": [33, 0, 0], "LIOT": [22, 0, 0], "GDR": [1, 4, 7], "UDR": [13, 0, 0]}, "titre": "l'ensemble de la proposition de loi visant à sortir la France du piège du narcotrafic (texte de la commission mixte paritaire)."}, {"id": 1624, "theme": "Sécurité & justice", "q": "Durcir la justice des mineurs délinquants et responsabiliser davantage leurs parents ?", "desc": "Proposition de loi visant à renforcer l'autorité de la justice à l'égard des mineurs délinquants et de leurs parents, vote sur le texte final.", "simple": "Accélère les procédures pour les mineurs délinquants, surtout les plus de 16 ans, et sanctionne davantage les parents qui se désintéressent de la procédure.", "note": null, "date": "13 mai 2025", "result": "Adopté", "total": [341, 187, 8], "groups" , 0, 0], "EPR": [39, 0, 0], "LFI": [0, 31, 0], "SOC": [27, 0, 0], "DR": [27, 0, 0], "ECOS": [19, 0, 0], "DEM": [21, 0, 0], "HOR": [19, 0, 0], "LIOT": [8, 0, 0], "UDR": [1, 0, 0], "GDR": [4, 0, 0]}, "titre": "l'ensemble de la proposition de loi visant à garantir le droit de visite des parlementaires et des bâtonniers dans les lieux de privation de liberté (texte de la commission mixte paritaire)."}, {"id": 7405, "theme": "Sécurité & justice", "q": "Renforcer la surveillance des personnes présentant un risque terroriste et la rétention des étrangers jugés dangereux ?", "desc": "Loi créant notamment une rétention de sûreté pour les condamnés terroristes et un examen psychiatrique sur injonction administrative, et durcissant la rétention des étrangers considérés comme une menace grave pour l'ordre public. Vote sur le texte final.", "simple": "Permet un suivi renforcé des personnes jugées dangereuses pour risque terroriste, y compris après leur peine, et durcit la rétention des étrangers considérés comme une menace grave.", "note": null, "date": "16 juin 2026", "result": "Adopté", "total": [345, 177, 11], "groups": {"RN": [117, 0, 0], "EPR": [86, 0, 0], "LFI": [0, 67, 0], "SOC": [0, 62, 0], "DR": [47, 0, 0], "ECOS": [0, 35, 0], "DEM": [26, 0, 1], "HOR": [33, 0, 0], "LIOT": [12, 0, 9], "GDR": [0, 12, 1], "UDR": [17, 0, 0]}, "titre": "l'ensemble de la proposition de loi visant à renforcer la sécurité, la rétention administrative et la prévention des risques d’attentat (texte de la commission mixte paritaire)."}, {"id": 7987, "theme": "Sécurité & justice", "q": "Créer une présomption de légitime défense pour les policiers et gendarmes qui font usage de leur arme ?", "desc": "Proposition de loi visant à reconnaître une présomption de légitime défense pour les forces de l'ordre dans l'exercice de leurs fonctions (première lecture).", "simple": "Quand un policier ou un gendarme utilise son arme en service, on présumerait qu'il était en légitime défense. Ce serait à l'accusation de prouver le contraire.", "note": null, "date": "7 juil. 2026", "result": "Adopté", "total": [313, 199, 5], "groups": {"RN": [122, 0, 0], "EPR": [55, 12, 0], "LFI": [0, 69, 0], "SOC": [0, 62, 0], "DR": [48, 0, 0], "ECOS": [0, 29, 0], "DEM": [28, 1, 5], "HOR": [31, 0, 0], "LIOT": [9, 8, 0], "UDR": [14, 0, 0], "GDR": [0, 17, 0]}, "titre": "l'ensemble de la proposition de loi visant à reconnaître une présomption de légitime défense pour les forces de l'ordre, dans l'exercice de leurs fonctions (première lecture)."}, {"id": 8042, "theme": "Sécurité & justice", "q": "Réorganiser la justice criminelle pour juger plus vite les crimes ?", "desc": "Loi sur la justice criminelle et le respect des victimes : davantage de lieux pour juger les crimes, procédure criminelle remaniée, droits des victimes renforcés. Vote sur le texte final.", "simple": "Pour réduire les délais, parfois de plusieurs années, avant un procès pour crime : plus de lieux pour juger, des procédures réorganisées, un meilleur accompagnement des victimes.", "note": null, "date": "8 juil. 2026", "result": "Adopté", "total": [283, 156, 1], "groups": {"RN": [80, 0, 0], "EPR": [85, 0, 1], "LFI": [0, 68, 0], "SOC": [0, 41, 0], "DR": [27, 0, 0], "ECOS": [0, 35, 0], "DEM": [31, 0, 0], "HOR": [34, 0, 0], "LIOT": [14, 0, 0], "UDR": [10, 0, 0], "GDR": [0, 12, 0]}, "titre": "l'ensemble du projet de loi sur la justice criminelle et le respect des victimes (texte de la commission mixte paritaire)."}, {"id": 8433, "theme": "Sécurité & justice", "q": "Sanctionner plus rapidement les rodéos motorisés, tirs de mortiers et rave-parties illégales ?", "desc": "Projet de loi visant à offrir des réponses immédiates aux phénomènes troublant l'ordre public, vote sur le texte final.", "simple": "Des réponses plus rapides et plus sévères contre les rodéos motorisés, les tirs de mortiers d'artifice sur les forces de l'ordre et les rave-parties illégales.", "note": null, "date": "21 juil. 2026", "result": "Adopté", "total": [351, 179, 7], "groups": {"RN": [114, 0, 0], "EPR": [84, 0, 0], "LFI": [0, 71, 0], "SOC": [0, 56, 1], "DR": [46, 0, 1], "ECOS": [0, 36, 0], "DEM": [33, 0, 0], "HOR": [32, 0, 0], "LIOT": [18, 1, 4], "UDR": [17, 0, 0], "GDR": [0, 15, 0]}, "titre": "l'ensemble du projet de loi visant à offrir des réponses immédiates aux phénomènes troublant l'ordre public, la sécurité et la tranquillité de nos concitoyens (texte de la commission mixte paritaire)."}, {"id": 1308, "theme": "Immigration", "q": "Durcir l'accès à la nationalité française par le droit du sol à Mayotte ?", "desc": "Proposition de loi renforçant les conditions d'accès à la nationalité française pour les enfants nés à Mayotte, vote sur le texte final.", "simple": "À Mayotte, un enfant né sur place ne pourrait devenir français par le droit du sol que si ses deux parents résidaient légalement en France depuis au moins un an avant sa naissance.", "note": null, "date": "8 avr. 2025", "result": "Adopté", "total": [339, 174, 11], "groups": {"RN": [122, 0, 0], "EPR": [73, 0, 4], "LFI": [0, 65, 0], "SOC": [0, 61, 3], "DR": [47, 0, 0], "ECOS": [0, 32, 0], "DEM": [30, 1, 3], "HOR": [32, 0, 0], "LIOT": [13, 0, 0], "GDR": [0, 13, 0], "UDR": [15, 0, 0]}, "titre": "l'ensemble de la proposition de loi visant à renforcer les conditions d'accès à la nationalité française à Mayotte (texte de la commission mixte paritaire)."}, {"id": 2958, "theme": "Immigration", "q": "Allonger la rétention des étrangers condamnés pour des faits particulièrement graves ?", "desc": "Proposition de loi visant à faciliter le maintien en rétention administrative des personnes condamnées pour des faits d'une particulière gravité, vote sur le texte final.", "simple": "Les étrangers condamnés pour des faits graves et visés par une expulsion pourraient être gardés plus longtemps en centre de rétention, le temps d'organiser leur départ.", "note": null, "date": "8 juil. 2025", "result": "Adopté", "total": [303, 168, 1], "groups": {"RN": [108, 0, 0], "EPR": [61, 1, , 0, 0], "SOC": [46, 0, 0], "DR": [10, 1, 0], "ECOS": [38, 0, 0], "DEM": [22, 0, 0], "HOR": [20, 0, 0], "LIOT": [2, 0, 0], "GDR": [8, 0, 0], "UDR": [0, 0, 7]}, "titre": "l'ensemble de la proposition de loi visant à protéger la population des risques liés aux substances perfluoroalkylées et polyfluoroalkylées (deuxième lecture)."}, {"id": 2460, "theme": "Écologie", "q": "Autoriser l'exportation de CO2 capté en France pour le stocker sous les fonds marins à l'étranger ?", "desc": "Ratification d'un amendement au protocole de Londres sur la pollution des mers, qui permet d'envoyer du CO2 capté sur des sites industriels vers des sites de stockage sous-marins d'autres pays.", "simple": "Permet à la France d'envoyer le CO2 capté dans ses usines vers d'autres pays, par exemple en mer du Nord, pour l'enfouir sous les fonds marins plutôt que de le rejeter dans l'air.", "note": null, "date": "17 juin 2025", "result": "Adopté", "total": [261, 107, 40], "groups": {"RN": [79, 0, 0], "EPR": [85, 0, 0], "LFI": [0, 61, 0], "SOC": [0, 5, 39], "DR": [32, 0, 1], "ECOS": [0, 30, 0], "DEM": [30, 0, 0], "HOR": [26, 0, 0], "LIOT": [1, 4, 0], "GDR": [0, 7, 0], "UDR": [6, 0, 0]}, "titre": "l'ensemble du projet de loi autorisant la ratification de la résolution LP.3(4) portant amendement de l’article 6 du Protocole de Londres de 1996 à la Convention de 1972 sur la prévention de la pollution des mers résultant de l’immersion de déchets et autres matières (texte de la commission mixte paritaire)."}, {"id": 2653, "theme": "Écologie", "q": "Adopter la programmation énergie-climat 2025-2035 (nucléaire et renouvelables) ?", "desc": "Proposition de loi portant programmation nationale pour l'énergie et le climat pour 2025 à 2035 (première lecture). Le texte a été rejeté.", "simple": "Devait fixer la feuille de route énergétique de la France pour dix ans : part du nucléaire, des énergies renouvelables, réduction des énergies fossiles.", "note": "Le texte avait été fortement modifié en séance avant le vote final : des groupes ont voté contre pour des raisons opposées. Un « contre » ne signifie donc pas la même chose pour tous.", "date": "24 juin 2025", "result": "Rejeté", "total": [142, 377, 47], "groups": {"RN": [122, 0, 0], "EPR": [0, 90, 1], "LFI": [0, 71, 0], "SOC": [0, 66, 0], "DR": [2, 0, 46], "ECOS": [0, 37, 0], "DEM": [0, 36, 0], "HOR": [0, 34, 0], "LIOT": [0, 23, 0], "GDR": [0, 13, 0], "UDR": [16, 0, 0]}, "titre": "l'ensemble de la proposition de loi portant programmation nationale pour l'énergie et le climat pour les années 2025 à 2035 (première lecture)."}, {"id": 2957, "theme": "Écologie", "q": "Assouplir les règles imposées aux agriculteurs, notamment sur certains pesticides et le stockage de l'eau ?", "desc": "Loi dite « Duplomb » visant à lever les contraintes à l'exercice du métier d'agriculteur, vote sur le texte final.", "simple": "Facilite certaines pratiques agricoles : retour possible d'un insecticide interdit (l'acétamipride), règles assouplies pour les grands élevages et les réserves d'eau. Le retour de l'insecticide a ensuite été censuré par le Conseil constitutionnel.", "note": null, "date": "8 juil. 2025", "result": "Adopté", "total": [316, 223, 25], "groups": {"RN": [119, 0, 2], "EPR": [64, 14, 10], "LFI": [0, 71, 0], "SOC": [0, 65, 0], "DR": [47, 0, 1], "ECOS": [0, 38, 0], "DEM": [26, 9, 1], "HOR": [26, 3, 4], "LIOT": [12, 3, 6], "GDR": [0, 17, 0], "UDR": [16, 0, 0]}, "titre": "l'ensemble de la proposition de loi visant à lever les contraintes à l'exercice du métier d'agriculteur (texte de la commission mixte paritaire)."}, {"id": 7409, "theme": "Écologie", "q": "Relancer les investissements dans l'hydroélectricité en réformant le régime des grands barrages ?", "desc": "Proposition de loi sur l'hydroélectricité, première énergie renouvelable du pays, vote sur le texte final. Elle change le cadre juridique des barrages pour sortir de contentieux avec la Commission européenne.", "simple": "Change le statut juridique des grands barrages pour débloquer des investissements, gelés depuis des années par un conflit avec la Commission européenne. En contrepartie, une part de l'électricité produite est ouverte aux concurrents d'EDF.", "note": "Certains députés favorables à l'hydroélectricité ont voté contre ou se sont abstenus, estimant que la réforme ne protégeait pas assez les barrages d'une privatisation.", "date": "17 juin 2026", "result": "Adopté", "total": [290, 59, 116], "groups": {"RN": [0, 0, 84], "EPR": [75, 0, 0], "LFI": [0, 59, 0], "SOC": [60, 0, 0], "DR": [36, 0, 0], "ECOS": [0, 0, 32], "DEM": [29, 0, 0], "HOR": [34, 0, 0], "LIOT": [18, 0, 0], "UDR": [17, 0, 0], "GDR": [16, 0, 0]}, "titre": "l'ensemble de la proposition de loi visant à relancer les investissements dans le secteur de l'hydroélectricité pour contribuer à la transition énergétique (texte de la commission mixte paritaire)."}, {"id": 789, "theme": "Agriculture", "q": "Adapter les règles de fonctionnement des chambres d'agriculture et de la Mutualité sociale agricole ?", "desc": "Proposition de loi visant à adapter le fonctionnement des instances de gouvernance des chambres d'agriculture et de la mutualité sociale agricole, vote sur le texte final.", "simple": "Des ajustements votés en urgence avant les élections agricoles de 2025 : règles sur les conflits d'intérêts des élus des chambres d'agriculture, calendrier des élections et listes paritaires pour la Mutualité sociale agricole.", "note": null, "date": "12 févr. 2025", "result": "Adopté", "total": [203, 44, 0], "groups": {"RN": [74, 0, 0], "EPR": [33, 0, 0], "LFI": [0, 29, 0], "SOC": [26, 0, 0], "DR": [17, 0, 0], "ECOS": [0, 15, 0], "DEM": [13, 0, 0], "HOR": [19, 0, 0], "LIOT": [7, 0, 0], "GDR": [2, 0, 0], "UDR": [7, 0, 0]}, "titre": "l'ensemble de la proposition de loi visant à adapter le fonctionnement des instances de gouvernance des chambres d'agriculture et de la mutualité sociale agricole (texte de la commission mixte paritaire)."}, {"id": 844, "theme": "Agriculture", "q function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function link(id){return 'https://www.assemblee-nationale.fr/dyn/17/scrutins/'+id}

// Position d'un groupe : répartition de ses votants (minimum 3 votants)
const MIN_VOTERS=3;
function groupPos(counts){
  if(!counts) return null;
  const [p,c,a]=counts, t=p+c+a;
  if(t<MIN_VOTERS) return null;
  const m=Math.max(p,c,a);
  const pos = p===m?'p':(c===m?'c':'a');
  return {pos, share:m/t, counts, total:t};
}
// Accord = part des votants du groupe ayant fait le même choix que vous + ½ de la part des abstentionnistes
function agreement(user, gp){
  const [p,c,a]=gp.counts, same = user==='p'?p:c;
  return (same + 0.5*a)/gp.total;
}
function compute(){
  const res=[];
  for(const k of Object.keys(GROUPS)){
    let sum=0,n=0; const rows=[];
    for(const v of state.list){
      const u=state.answers[v.id]; if(!u||u==='s') continue;
      const gp=groupPos(v.groups[k]); if(!gp) { rows.push({v,u,gp:null}); continue; }
      const s=agreement(u,gp); sum+=s; n++; rows.push({v,u,gp,s});
    }
    if(n) res.push({k, pct:Math.round(100*sum/n), n, rows});
  }
  return res.sort((a,b)=>b.pct-a.pct || b.n-a.n);
}

function render(){

// Tirage aléatoire équilibré : on pioche à tour de rôle dans chaque thème, puis on mélange l'ordre
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function draw(n){
  const byTheme={}; VOTES.forEach(v=>(byTheme[v.theme]=byTheme[v.theme]||[]).push(v));
  const buckets=shuffle(Object.values(byTheme).map(shuffle)); const out=[];
  while(out.length<n && buckets.some(b=>b.length)){ for(const b of buckets){ if(out.length<n && b.length) out.push(b.pop()); } }
  return shuffle(out);
}
const SIZES={q:15,s:30};
function start(mode){
  state.mode=mode;
  state.list = mode==='c' ? shuffle(VOTES) : draw(SIZES[mode]);
  state.i=0; state.answers={}; state.open=null; go('quiz');
}

function answer(a){
  state.answers[state.list[state.i].id]=a;

function level(s){return s>=2/3?'agree':(s<=1/3?'dis':'mid')}
function chip(gp,s){
  if(!gp) return `<span class="chip c-mid">Groupe absent ou moins de 3 votants</span>`;
  const l=level(s), word={agree:'Accord',dis:'Désaccord',mid:'Partiel'}[l];
  return `<span class="chip c-${l}">${word} · ${Math.round(100*s)} %</span>`;
}

function results(){
  const res=compute();

function method(){
  const t=state.tab||'m';
  const tab=(k,l)=>`<button class="${t===k?'on':''}" onclick="state.tab='${k}';render()">${l}</button>`;
  let body='';
  if(t==='m') body=METHOD();
  else if(t==='q') body=allQuestions();
  else body=excluded();
  return `<div class="screen"><div class="blob b1" aria-hidden="true"></div>
  <div class="top"><button class="icon-btn" aria-label="Retour" onclick="go(state.back||'home')">${ICON.back}</button><span class="count">Transparence</span><span style="width:44px"></span></div>
  <div class="hero" style="padding:24px 24px"><h1 style="font-size:28px">Tout est vérifiable</h1><p class="lead" style="font-size:14px;margin-top:6px">Comment les questions sont choisies, lesquelles sont utilisées, et lesquelles ne le sont pas.</p></div>
  <div class="sheet grow method">
    <div class="tabs" role="tablist">${tab('m','Méthode')}${tab('q','Questions')}${tab('x','Votes écartés')}</div>
    ${body}
    <p class="small muted" style="margin-top:24px">Données : open data de l'Assemblée nationale, version du ${DATA_DATE}.</p>
  </div></div>`;
}
function METHOD(){return `
    <p><b>Les questions ne sont pas choisies à la main.</b> Elles sont sélectionnées automatiquement, avec des règles fixes et publiques, parmi tous les scrutins publics de la 17<sup>e</sup> législature (depuis juillet 2024). Un scrutin est retenu seulement s'il remplit toutes ces conditions :</p>
    <ul>
      <li>c'est le <b>vote final</b> sur un texte (vote « sur l'ensemble », ou sur une résolution) ;</li>
      <li><b>au moins 200 députés</b> ont voté, pour écarter les votes à faible participation ;</li>
      <li>il <b>divise</b> l'Assemblée : au moins un groupe majoritairement pour et un autre majoritairement contre ;</li>
      <li>ce n'est <b>pas un budget</b> (lois de finances, financement de la Sécurité sociale, comptes) : ces textes regroupent des centaines de mesures et un seul vote ne permet pas de savoir sur quoi on est d'accord.</li>
    </ul>
    <p>Quand un même texte a été voté plusieurs fois (plusieurs lectures), seul le dernier vote est gardé. Les votes tactiques ou de procédure (motions de censure, de rejet, votes de confiance) ne sont jamais utilisés. Résultat : ${VOTES.length} questions, sur 12 thèmes.</p>
    <p><b>Le tirage.</b> En mode Rapide et Standard, les questions sont tirées au hasard en piochant à tour de rôle dans chaque thème, puis présentées dans un ordre aléatoire. Le mode Complet propose toutes les questions.</p>
    <p><b>Le calcul.</b> Pour chaque question où vous avez répondu, on regarde comment ont voté <b>tous les députés</b> de chaque groupe, pas seulement la majorité :</p>
    <ul><li>accord = part des votants du groupe ayant fait le même choix que vous</li><li>+ la moitié de la part des votants qui se sont abstenus</li></ul>
    <p>Exemple : vous votez Pour ; dans un groupe, 30 députés ont voté pour, 10 contre et 10 se sont abstenus. Accord = (30 + 5) / 50 = 70 %. Un groupe divisé compte donc vraiment comme divisé. Le pourcentage final est la moyenne sur les questions comparées. Un groupe n'est pas comparé sur un vote si moins de 3 de ses députés y ont participé. Les questions que vous passez ne comptent pas.</p>
    <p><b>Les limites.</b> Un vote résume parfois mal une position : un groupe peut voter contre un texte pour des raisons opposées à celles d'un autre. Des notes de contexte le signalent quand c'est le cas. Les députés non inscrits ne sont pas comparés. Les partis sans groupe à l'Assemblée n'apparaissent pas.</p>
    <p><b>Les données</b> proviennent de l'open data officiel de l'Assemblée nationale (data.assemblee-nationale.fr), version du 29 octobre 2026. Chaque question renvoie au scrutin officiel. ActeVote est une application indépendante, sans lien avec l'État ni avec un parti.</p>
`;}
function allQuestions(){
  let html=`<div class="warn">Astuce : faites le test avant de consulter cette liste, pour que les votes des groupes n'influencent pas vos réponses.</div>
  <p>Les ${VOTES.length} scrutins utilisés, classés par thème. Touchez une question pour voir le titre officiel et le vote de chaque groupe.</p>`;
  let th='';
  for(const v of VOTES){
    if(v.theme!==th){th=v.theme;html+=`<div class="th-t">${esc(th)}</div>`}
    const rows=Object.keys(GROUPS).map(k=>{const c=v.groups[k];return c?`<tr><td>${esc(GROUPS[k].name)}</td><td>${c[0]}</td><td>${c[1]}</td><td>${c[2]}</td></tr>`:''}).join('');
    html+=`<details class="tq"><summary>${esc(v.q)}<span class="sub">${esc(v.result)} le ${esc(v.date)} · ${v.total[0]} pour, ${v.total[1]} contre, ${v.total[2]} abst.</span></summary>
      <div class="in"><p class="small" style="margin:0 0 6px"><b>Titre officiel :</b> ${esc(v.titre||v.desc)}</p>
      <table class="gt"><tr><td class="muted">Groupe</td><td class="muted">Pour</td><td class="muted">Contre</td><td class="muted">Abst.</td></tr>${rows}</table>
      ${v.note?`<div class="note">${esc(v.note)}</div>`:''}
      <div style="margin-top:8px"><a class="lnk" href="${link(v.id)}" target="_blank" rel="noopener">Scrutin officiel n°${v.id} →</a></div></div></details>`;
  }
  return html;
}
function excluded(){
  return `<p>Certains votes marquants ne figurent pas dans le test. Ce n'est pas un choix au cas par cas : ils ne remplissent pas l'une des règles de sélection, appliquée de la même façon à tous les textes.</p>
  <p><b>Toujours écartés :</b></p>
  <ul><li><b>les budgets</b> (lois de finances et de financement de la Sécurité sociale) : des centaines de mesures en un seul vote ;</li>
  <li><b>les motions de censure, de rejet et les votes de confiance</b> : ce sont des votes de stratégie politique ;</li>
  <li><b>les votes sur un article ou un amendement</b> : seul le vote final sur un texte est retenu ;</li>
  <li><b>les votes où moins de 200 députés ont voté</b> ;</li>
  <li><b>les votes qui ne divisent pas</b> : si aucun groupe ne vote contre (ou aucun pour), le vote ne permet pas de distinguer les groupes ;</li>
  <li><b>les lectures intermédiaires</b> : quand un texte est voté plusieurs fois, seul le dernier vote compte.</li></ul>
  <p><b>Exemples de votes écartés</b> (dont des votes qui figuraient dans une version précédente de l'application), avec la règle qui s'applique :</p>
  ${EXCLUDED.map(e=>`<details class="tq"><summary>${esc(e.titre)}<span class="sub">${esc(e.date)} · ${e.total} votants</span><span class="sub" style="color:#a32020;font-weight:700">Écarté : ${esc(e.why)}</span></summary>
    <div class="in">
    <div style="margin-top:8px"><a class="lnk" href="${link(e.id)}" target="_blank" rel="noopener">Scrutin officiel n°${e.id} →</a></div></div></details>`).join('')}`;
}

// Partage : menu natif du téléphone, sinon copie dans le presse-papiers
function appUrl(){const c=document.querySelector('link[rel=canonical]');const h=c&&c.href;return (h&&h.startsWith('http')&&!h.includes('__'+'BASE__'))?h:location.href.split('#')[0]}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function share(text){
  const url=appUrl();
  if(navigator.share){navigator.share({title:'ActeVote',text,url}).catch(()=>{});return}
  const all=text+' '+url;
  (navigator.clipboard?navigator.clipboard.writeText(all):Promise.reject()).then(()=>toast('Texte et lien copiés')).catch(()=>prompt('Copiez ce texte :',all));
}

    facebook:'https://www.facebook.com/sharer/sharer.php?u='+eu,
    x:'https://x.com/intent/post?text='+et+'&url='+eu
  };
  if(net==='messenger'){
    if(mobile){location.href='fb-messenger://share?link='+eu;return}
    copyLink('Lien copié : collez-le dans Messenger');return;
  }
  if(net==='instagram'){copyLink('Lien copié : collez-le dans votre story (sticker « Lien ») ou en message');return}
  window.open(links[net],'_blank','noopener');
}
function copyLink(msg){const u=appUrl();(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast(msg)).catch(()=>prompt('Copiez ce lien :',u))}
function shareRow(){
  const n=[['whatsapp','WhatsApp'],['messenger','Messenger'],['instagram','Instagram'],['telegram','Telegram'],['facebook','Facebook'],['x','X']];
  return `<div class="soc">${n.map(([k,l])=>`<button class="soc-b" onclick="socialShare('${k}')">${l}</button>`).join('')}<button class="soc-b" onclick="shareApp()">Autres…</button></div>`;
}
function shareApp(){share("Les programmes sont des promesses, les votes ne le sont pas. Testez-vous sur de vrais votes de l'Assemblée nationale :")}
function shareResult(){
  const res=compute(), top=res.filter(r=>r.pct===res[0].pct);
  const n=state.list.filter(v=>state.answers[v.id]&&state.answers[v.id]!=='s').length;
  const names=top.slice(0,3).map(r=>GROUPS[r.k].name).join(', ');
  share(`Sur ${n} votes réels de l'Assemblée nationale, mes réponses sont les plus proches de : ${names} (${res[0].pct} % d'accord). Ce n'est pas une consigne de vote, juste une comparaison avec les actes. Et vous ? Méthode et sources dans l'appli :`);
}
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost') && !location.hostname.endsWith('claude.ai') && !location.hostname.includes('claudeusercontent')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
render();
</script>
